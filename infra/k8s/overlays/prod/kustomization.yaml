apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tradenest-prod

resources:
  - ../../base
  - namespace.yaml
  - deployments.yaml
  - services.yaml
  - ingress.yaml
  - configmap.yaml
  - secrets.yaml
  - hpa.yaml
  - pdb.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=frontend

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: gateway
                resources:
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=gateway

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth
      spec:
        replicas: 3
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=auth

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog
      spec:
        replicas: 3
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=catalog

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order
      spec:
        replicas: 3
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=order

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment
      spec:
        replicas: 3
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=payment

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ai
      spec:
        replicas: 2
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=ai

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification
      spec:
        replicas: 2
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=notification

images:
  - name: ghcr.io/tradenest/frontend
    newTag: latest
  - name: ghcr.io/tradenest/gateway
    newTag: latest
  - name: ghcr.io/tradenest/auth
    newTag: latest
  - name: ghcr.io/tradenest/catalog
    newTag: latest
  - name: ghcr.io/tradenest/order
    newTag: latest
  - name: ghcr.io/tradenest/payment
    newTag: latest
  - name: ghcr.io/tradenest/ai
    newTag: latest
  - name: ghcr.io/tradenest/notification
    newTag: latest

commonLabels:
  environment: production