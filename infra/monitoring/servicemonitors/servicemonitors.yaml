apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tradenest-auth
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  namespaceSelector:
    matchNames:
      - tradenest-prod
      - tradenest-staging
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
