apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tradenest-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: tradenest.rules
      rules:
        - alert: ServiceDown
          expr: up{job=~"tradenest-.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "{{ $labels.job }} has been down for more than 1 minute."
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
            > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High error rate on {{ $labels.job }}"
            description: "Error rate >5% for {{ $labels.job }}."
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency on {{ $labels.job }}"
            description: "95th percentile latency >1s for {{ $labels.job }}."
        - alert: PodMemoryUsageHigh
          expr: |
            (container_memory_usage_bytes{container!="", namespace=~"tradenest-.*"} / container_spec_memory_limit_bytes) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} memory usage >85% of limit."
        - alert: PodCPUUsageHigh
          expr: |
            sum(rate(container_cpu_usage_seconds_total{container!="", namespace=~"tradenest-.*"}[5m])) by (pod)
            /
            sum(container_spec_cpu_quota/container_spec_cpu_period{container!="", namespace=~"tradenest-.*"}) by (pod)
            > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} CPU usage >85% of limit."
        - alert: DiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk space low on {{ $labels.instance }}"
            description: "Less than 10% disk space left."
        - alert: PodRestartLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"tradenest-.*"}[15m]) > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} restarting frequently"
            description: "Pod {{ $labels.pod }} restarted >5 times in 15 minutes."