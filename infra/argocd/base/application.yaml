apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tradenest
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/tradenest.git
    targetRevision: HEAD
    path: infra/helm/tradenest
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.environment }}.yaml
      parameters: []
  destination:
    server: https://kubernetes.default.svc
    namespace: tradenest-{{ .Values.environment }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data