apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tradenest-secrets
  namespace: tradenest-{{ .Values.environment }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: tradenest-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: tradenest/{{ .Values.environment }}/database-url
    - secretKey: redis-url
      remoteRef:
        key: tradenest/{{ .Values.environment }}/redis-url
    - secretKey: jwt-secret
      remoteRef:
        key: tradenest/{{ .Values.environment }}/jwt-secret
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: tradenest/{{ .Values.environment }}/jwt-refresh-secret
    - secretKey: razorpay-key-id
      remoteRef:
        key: tradenest/{{ .Values.environment }}/razorpay-key-id
    - secretKey: razorpay-key-secret
      remoteRef:
        key: tradenest/{{ .Values.environment }}/razorpay-key-secret
    - secretKey: stripe-secret-key
      remoteRef:
        key: tradenest/{{ .Values.environment }}/stripe-secret-key
    - secretKey: smtp-host
      remoteRef:
        key: tradenest/{{ .Values.environment }}/smtp-host
    - secretKey: smtp-port
      remoteRef:
        key: tradenest/{{ .Values.environment }}/smtp-port
    - secretKey: smtp-user
      remoteRef:
        key: tradenest/{{ .Values.environment }}/smtp-user
    - secretKey: smtp-pass
      remoteRef:
        key: tradenest/{{ .Values.environment }}/smtp-pass