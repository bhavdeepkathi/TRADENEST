# Staging overrides
global:
  environment: staging
  domain: staging.tradenest.io

auth:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

catalog:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

order:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

payment:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

ai:
  replicaCount: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

notification:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

gateway:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ingress:
    hosts:
      - host: api.staging.tradenest.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tradenest-staging-tls
        hosts:
          - api.staging.tradenest.io

frontend:
  replicaCount: 2
  ingress:
    hosts:
      - host: staging.tradenest.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tradenest-staging-tls
        hosts:
          - staging.tradenest.io