name: CD Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PROJECT_NAME: tradenest
  STAGING_TAG: staging

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Update image tags in staging values
        run: |
          sed -i "s|image: .*/frontend:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/frontend:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/auth:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/auth:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/catalog:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/catalog:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/order:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/order:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/payment:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/payment:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/ai:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/ai:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/notification:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/notification:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml
          sed -i "s|image: .*/gateway:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/gateway:${{ env.STAGING_TAG }}|g" infra/k8s/overlays/staging/kustomization.yaml

      - name: Deploy to Staging with Kustomize
        run: |
          kubectl apply -k infra/k8s/overlays/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/auth -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/catalog -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/order -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/payment -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/ai -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/notification -n tradenest-staging --timeout=300s
          kubectl rollout status deployment/gateway -n tradenest-staging --timeout=300s

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging.tradenest.io/health || exit 1
          curl -f https://api.staging.tradenest.io/health || exit 1

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: "Staging deployment ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}