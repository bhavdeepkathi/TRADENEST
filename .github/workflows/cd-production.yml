name: CD Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  PROJECT_NAME: tradenest

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.PROD_KUBECONFIG }}

      - name: Update image tags in production values
        run: |
          TAG="${{ steps.version.outputs.version }}"
          sed -i "s|image: .*/frontend:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/frontend:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/auth:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/auth:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/catalog:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/catalog:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/order:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/order:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/payment:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/payment:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/ai:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/ai:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/notification:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/notification:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml
          sed -i "s|image: .*/gateway:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}/gateway:${TAG}|g" infra/k8s/overlays/prod/kustomization.yaml

      - name: Deploy to Production with Kustomize
        run: |
          kubectl apply -k infra/k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/auth -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/catalog -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/order -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/payment -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/ai -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/notification -n tradenest-prod --timeout=600s
          kubectl rollout status deployment/gateway -n tradenest-prod --timeout=600s

      - name: Run smoke tests
        run: |
          sleep 60
          curl -f https://tradenest.io/health || exit 1
          curl -f https://api.tradenest.io/health || exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: "Production deployment ${{ steps.version.outputs.version }} ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/frontend -n tradenest-prod
          kubectl rollout undo deployment/auth -n tradenest-prod
          kubectl rollout undo deployment/catalog -n tradenest-prod
          kubectl rollout undo deployment/order -n tradenest-prod
          kubectl rollout undo deployment/payment -n tradenest-prod
          kubectl rollout undo deployment/ai -n tradenest-prod
          kubectl rollout undo deployment/notification -n tradenest-prod
          kubectl rollout undo deployment/gateway -n tradenest-prod